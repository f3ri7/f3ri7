<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Ryuu — CS student, data science and AI, photography">
  <style>
    /* palette: dark */
    .bg1 { stop-color: #16161b; } .bg2 { stop-color: #0b0b0d; }
    .ink { fill: #ece8e1; } .muted { fill: #8a8690; } .accent { fill: #f472b6; }
    .sun { fill: #f472b6; } .glow { fill: #f472b6; opacity: .35; }
    .kanji { fill: #0e0e11; opacity: .92; }
    .far { fill: #22222a; } .near { fill: #141418; }
    .p { fill: #f9a8d4; }

    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .mono  { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, 'Courier New', monospace; }
    .jp    { font-family: 'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif CJK JP', 'MS Mincho', serif; }

    .fade { opacity: 0; animation: in 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .45s; }
    .d3 { animation-delay: .75s; } .d4 { animation-delay: 1.05s; }
    @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    .rise { animation: rise 1.8s cubic-bezier(.2,.7,.2,1) forwards; transform: translateY(40px); opacity: 0; }
    @keyframes rise { to { transform: none; opacity: 1; } }

    .pulse { animation: pulse 5s ease-in-out infinite; transform-origin: 880px 190px; }
    @keyframes pulse { 0%,100% { opacity: .25; transform: scale(1); } 50% { opacity: .45; transform: scale(1.06); } }

    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .p { opacity: 0; animation: fall linear infinite; }
    @keyframes fall {
      0%   { opacity: 0;  transform: translate(0, 0) rotate(0deg); }
      12%  { opacity: .9; }
      85%  { opacity: .9; }
      100% { opacity: 0;  transform: translate(-340px, 430px) rotate(320deg); }
    }
  </style>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="bg1"/><stop offset="1" class="bg2"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#sky)"/>

  <!-- sun -->
  <g class="rise">
    <circle class="glow pulse" cx="880" cy="190" r="118" filter="url(#blur)"/>
    <circle class="sun" cx="880" cy="190" r="105"/>
    <text class="kanji jp" x="880" y="232" font-size="118" text-anchor="middle">竜</text>
  </g>

  <!-- mountains -->
  <path class="far"  d="M0 360 L140 345 L260 352 L380 330 L480 340 L580 302 L660 318 L760 262 L840 290 L920 250 L1010 280 L1090 256 L1200 276 V400 H0 Z"/>
  <path class="near" d="M0 382 L180 368 L300 376 L440 356 L560 366 L680 332 L780 350 L900 314 L1000 338 L1100 318 L1200 332 V400 H0 Z"/>

  <!-- petals -->
  <g>
    <ellipse class="p" cx="1010" cy="-10" rx="5" ry="3" style="animation-duration:9s;  animation-delay:0s"/>
    <ellipse class="p" cx="760"  cy="-10" rx="4" ry="2.5" style="animation-duration:11s; animation-delay:1.5s"/>
    <ellipse class="p" cx="1150" cy="-10" rx="5" ry="3" style="animation-duration:10s; animation-delay:3s"/>
    <ellipse class="p" cx="620"  cy="-10" rx="3.5" ry="2" style="animation-duration:12s; animation-delay:4.5s"/>
    <ellipse class="p" cx="930"  cy="-10" rx="4.5" ry="2.8" style="animation-duration:8.5s; animation-delay:6s"/>
    <ellipse class="p" cx="1080" cy="-10" rx="3.5" ry="2.2" style="animation-duration:10.5s; animation-delay:7.5s"/>
    <ellipse class="p" cx="840"  cy="-10" rx="4" ry="2.4" style="animation-duration:9.5s; animation-delay:2.2s"/>
  </g>

  <!-- text -->
  <g>
    <text class="muted mono fade d1" x="92" y="120" font-size="18">// hello, I'm<tspan class="accent cursor"> ▍</tspan></text>
    <text class="ink serif fade d2" x="88" y="208" font-size="98" letter-spacing="2">Ryuu</text>
    <text class="ink mono fade d3" x="92" y="256" font-size="19">cs student · data science &amp; ai · photography</text>
    <text class="muted mono fade d4" x="92" y="288" font-size="16"><tspan class="accent">▸</tspan> italy  ·  @f3ri7  ·  always learning</text>
  </g>
</svg>
